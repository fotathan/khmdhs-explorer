# Asterisk PBX for the CTI prototype — see TELEPHONY_RUNBOOK.md.
#
# One container: an Asterisk with two WebRTC endpoints (1001, 1002), a WebSocket
# transport for the browser softphones, and AMI enabled for the screen-pop
# listener. No SIP trunk — the demo is extension-to-extension, which is enough
# to prove click-to-call + caller-ID screen-pop end to end.
#
#   docker compose -f telephony/docker-compose.yml up
#
# Any Asterisk 18+ image that reads /etc/asterisk works; andrius/asterisk is a
# convenient prebuilt one.
services:
  asterisk:
    image: andrius/asterisk:20-alpine
    container_name: khmdhs-asterisk
    ports:
      - "8088:8088"                    # HTTP + SIP-over-WebSocket (browser → PBX)
      - "5038:5038"                    # AMI (backend screen-pop listener → PBX)
      - "10000-10200:10000-10200/udp"  # RTP media (see runbook re: macOS audio)
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/manager.conf:/etc/asterisk/manager.conf:ro
      - ./asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro
      # Call recordings (MixMonitor) — shared with the app for post-call
      # summarisation. Point the app's CALL_RECORDING_DIR at the host side of
      # this mount (the absolute path to telephony/recordings). See
      # TELEPHONY_RUNBOOK.md → "Call summarisation".
      - ./recordings:/var/spool/asterisk/monitor
    restart: unless-stopped

  # Self-hosted, OpenAI-compatible speech-to-text (faster-whisper) for call
  # summarisation — so transcription needs no OpenAI key. app/transcribe.py talks
  # the OpenAI /v1/audio/transcriptions shape, so point it at this service:
  #   export TRANSCRIBE_BASE_URL=http://localhost:8000/v1
  #   export TRANSCRIBE_API_KEY=            # empty — this server needs no auth
  #   export TRANSCRIBE_MODEL=Systran/faster-whisper-small   # multilingual (incl. Greek)
  # The first request downloads the model into the named volume (cached after).
  # This is the CPU image; for GPU use `:latest-cuda` + a GPU runtime and set
  # WHISPER__INFERENCE_DEVICE=cuda. `whisper` is an extra profile so it only
  # starts when asked:  docker compose -f telephony/docker-compose.yml --profile whisper up
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: khmdhs-whisper
    profiles: ["whisper"]
    ports:
      - "8000:8000"                     # OpenAI-compatible STT (app → whisper)
    environment:
      - WHISPER__MODEL=Systran/faster-whisper-small
      - WHISPER__INFERENCE_DEVICE=cpu
      - WHISPER__COMPUTE_TYPE=int8
    volumes:
      - whisper-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  whisper-cache:
