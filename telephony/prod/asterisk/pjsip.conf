; pjsip.conf — PRODUCTION template (see telephony/prod/README.md).
;
; Differences from the local-dev telephony/asterisk/pjsip.conf:
;   * public-IP media/signaling on the transport, so ICE candidates are routable
;     (no rtp.conf ice_host_candidates hack — that's a macOS-Docker workaround);
;   * one [agentNNNN] endpoint/AOR block PER AGENT (replace the two examples),
;     matching a proc.sip_extension row (Phase 3);
;   * NO static [*-auth] blocks — the auth object is served from PJSIP realtime
;     (proc.ps_auths), so the app can rotate the short-lived secret. Each endpoint
;     just references auth=<sip_user>-auth, which the app writes (id=<sip_user>-auth,
;     username=<sip_user>). See sorcery.conf + extconfig.conf.
;
; REPLACE every <ANGLE_BRACKET> placeholder before use.

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0
; Public IP so RTP/ICE candidates the browser receives are routable. Caddy
; terminates wss and proxies plain ws to 127.0.0.1:8088, so signaling itself is
; local — but media (RTP) flows directly to this host's public IP.
external_media_address=<VPS_PUBLIC_IP>
external_signaling_address=<VPS_PUBLIC_IP>

; ---- shared templates ----------------------------------------------------- ;
[endpoint-webrtc](!)
type=endpoint
context=internal
disallow=all
allow=opus
allow=ulaw
webrtc=yes
dtls_auto_generate_cert=yes

[aor-webrtc](!)
type=aor
max_contacts=5
remove_existing=yes

; ---- one block per agent (TEMPLATE — copy per agent, delete the examples) -- ;
; The auth object (auth=<sip_user>-auth) is NOT defined here; it lives in
; proc.ps_auths (realtime), rotated by the app. callerid must be a real number
; that matches a seeded proc.customer_profile.phone for a named screen-pop.

[agent1001](endpoint-webrtc)
auth=1001-auth
aors=1001
callerid=<Agent One> <<AGENT1_CALLERID_E164>>

[1001](aor-webrtc)

[agent1002](endpoint-webrtc)
auth=1002-auth
aors=1002
callerid=<Agent Two> <<AGENT2_CALLERID_E164>>

[1002](aor-webrtc)
