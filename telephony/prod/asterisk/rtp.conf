; rtp.conf — PRODUCTION template.
;
; RTP media port range (must match the firewall + the docker-compose UDP range).
; On a real public host the transport's external_media_address (pjsip.conf) makes
; ICE candidates routable — the local-dev ice_host_candidates hack is NOT used.

[general]
rtpstart=10000
rtpend=10200
icesupport=yes
; stunaddr=stun.l.google.com:19302   ; optional: aids ICE for some client networks
