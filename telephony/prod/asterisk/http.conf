; http.conf — PRODUCTION template.
;
; The built-in HTTP server serves the SIP WebSocket. Bind it to LOCALHOST only —
; Caddy (Caddyfile) terminates TLS on :443 and reverse-proxies wss://…/ws to
; ws://127.0.0.1:8088/ws. Never expose :8088 publicly; browsers only ever talk
; to Caddy over wss.

[general]
enabled=yes
bindaddr=127.0.0.1
bindport=8088
