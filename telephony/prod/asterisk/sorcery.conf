; sorcery.conf — PRODUCTION template.
;
; Serve ONLY the PJSIP `auth` object from realtime (proc.ps_auths), so the app
; can rotate each agent's short-lived SIP secret and Asterisk reads the current
; one on the next REGISTER. Endpoints and AORs stay in pjsip.conf (the default
; 'config' source), so there's no realtime dependency for the static parts.
;
; 'ps_auths' below is the extconfig.conf family name (see extconfig.conf).

[res_pjsip]
auth=realtime,ps_auths
