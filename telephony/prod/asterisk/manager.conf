; manager.conf — PRODUCTION template. AMI, read by the app's screen-pop listener.
;
; HARDENED vs the demo: a real secret, and permit= restricted to the private
; tunnel only. AMI (:5038) must NEVER be publicly reachable — bind it to the
; Tailscale interface and allow only the tailnet CIDR. The app reaches it as
; AMI_HOST=<vps tailscale IP> over the tunnel.

[general]
enabled=yes
port=5038
; Bind to the Tailscale interface IP, not 0.0.0.0, so AMI isn't exposed on the
; public NIC. (With host networking this binds the real tailnet address.)
bindaddr=<VPS_TAILSCALE_IP>
; tlsenable=yes               ; enable if you cannot fully isolate AMI to the tunnel
; tlsbindaddr=<VPS_TAILSCALE_IP>:5039
; tlscertfile=/etc/asterisk/keys/ami.pem

[khmdhs]
secret=<STRONG_AMI_SECRET>    ; NOT the demo 'khmdhs-ami-secret'
; Read-only classes are all the screen-pop listener needs; grant no write.
read=call,dialplan,system
write=
deny=0.0.0.0/0.0.0.0
permit=<TAILNET_CIDR>         ; e.g. 100.64.0.0/10 (Tailscale) — only the tunnel
