; res_pgsql.conf — PRODUCTION template (read by res_config_pgsql).
;
; Asterisk's read-only connection to Postgres for PJSIP realtime auth. Point it
; at the SAME database the app writes (Supabase / your Postgres), over the
; PRIVATE path — the Tailscale tunnel or an internal network, never the public
; internet in cleartext. Requires an Asterisk image built WITH res_config_pgsql
; (see README — ODBC via res_config_odbc is the fallback if your image lacks it).
;
; Use a LEAST-PRIVILEGE, read-only role for Asterisk (SELECT on proc.ps_auths
; only) with search_path set to include proc (see extconfig.conf).

[general]
dbhost=<PG_HOST>              ; e.g. the Supabase host, or the VPS Tailscale IP of a local PG
dbport=5432
dbname=<ASTERISK_DB_NAME>
dbuser=<ASTERISK_DB_USER>     ; read-only role; SELECT on proc.ps_auths
dbpass=<ASTERISK_DB_PASSWORD>
; requiressl=yes              ; enable when the DB requires TLS (Supabase does)
