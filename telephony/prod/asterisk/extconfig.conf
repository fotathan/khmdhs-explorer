; extconfig.conf — PRODUCTION template.
;
; Map the realtime family 'ps_auths' to a database table via res_config_pgsql.
; Syntax: <family> => <driver>,<database>,<table>
;   driver   = pgsql          (res_config_pgsql; see res_pgsql.conf)
;   database = the dbname configured in res_pgsql.conf
;   table    = ps_auths
;
; NOTE ON SCHEMA: our table is proc.ps_auths, but Asterisk queries the unqualified
; name `ps_auths`. Give the Asterisk DB role a search_path that includes proc, so
; the unqualified name resolves there (run once, as the DB owner):
;     ALTER ROLE <ASTERISK_DB_USER> SET search_path = proc, public;
; (Alternatively expose a `public.ps_auths` view over proc.ps_auths.)

[settings]
ps_auths => pgsql,<ASTERISK_DB_NAME>,ps_auths
