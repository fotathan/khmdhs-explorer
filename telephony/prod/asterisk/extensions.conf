; extensions.conf — PRODUCTION template (internal-only, ≤5 agents, no PSTN).
;
; Dialing an agent's extension rings their endpoint. Endpoints are named
; [agentNNNN] (pjsip.conf) so Dial targets PJSIP/agentNNNN. Add one exten per
; agent, matching the pjsip.conf blocks and the proc.sip_extension rows.
;
; MixMonitor records each answered call for post-call summarisation (see
; TELEPHONY_RUNBOOK.md → Call summarisation); point CALL_RECORDING_DIR at the
; shared recordings volume. Drop the MixMonitor lines if you don't use summaries.

[internal]
exten => 1001,1,MixMonitor(${UNIQUEID}.wav,b)
 same  => n,Dial(PJSIP/agent1001,30)
 same  => n,Hangup()

exten => 1002,1,MixMonitor(${UNIQUEID}.wav,b)
 same  => n,Dial(PJSIP/agent1002,30)
 same  => n,Hangup()

; Echo test for an agent to check mic/speakers (no second party).
exten => 600,1,Answer()
 same  => n,Playback(demo-echotest)
 same  => n,Echo()
 same  => n,Hangup()

; PSTN (Phase 6, deferred): route inbound DIDs into this context to an agent's
; endpoint (same DialBegin → screen-pop fires), and add an outbound route for
; agent-dialed numbers via the trunk. No app change.
