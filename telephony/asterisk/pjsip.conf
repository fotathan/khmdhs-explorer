; pjsip.conf — two WebRTC softphone endpoints for the CTI prototype.
;
; ext 1001 and ext 1002 each register from a browser (JsSIP) over the WebSocket
; transport. `webrtc=yes` is the Asterisk shorthand that turns on everything a
; browser needs (AVPF, DTLS-SRTP, ICE, rtcp-mux); `dtls_auto_generate_cert=yes`
; means no cert files to manage.
;
; The important CTI detail: each endpoint's `callerid` is set to a REAL phone
; number. When 1001 calls 1002, Asterisk's DialBegin event carries that number
; as CallerIDNum, the backend looks it up in the CRM, and the agent on 1002 gets
; the screen-pop. Point 1001's callerid at a number you seed into
; proc.customer_profile (see telephony/seed_demo.sql) to see a named match.

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

; ---- shared templates ----------------------------------------------------- ;
[endpoint-webrtc](!)
type=endpoint
context=internal
disallow=all
allow=opus
allow=ulaw
webrtc=yes
dtls_auto_generate_cert=yes

[auth-userpass](!)
type=auth
auth_type=userpass

[aor-webrtc](!)
type=aor
max_contacts=1
remove_existing=yes

; ---- ext 1001 : stands in for an inbound customer line -------------------- ;
; callerid number must match a seeded customer_profile.phone to get a named pop.
[1001](endpoint-webrtc)
auth=1001
aors=1001
callerid=Demo Customer <2101234567>

[1001](auth-userpass)
username=1001
password=1001pass

[1001](aor-webrtc)

; ---- ext 1002 : the agent who receives the screen-pop --------------------- ;
[1002](endpoint-webrtc)
auth=1002
aors=1002
callerid=Agent B <2109999999>

[1002](auth-userpass)
username=1002
password=1002pass

[1002](aor-webrtc)
