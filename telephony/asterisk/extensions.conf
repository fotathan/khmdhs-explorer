; extensions.conf — dialplan for the prototype + PSTN trunk (Twilio).
;
; Dialing 1001/1002 rings that endpoint. 600 is an echo test for checking your
; mic/speakers in a single tab (no second party needed).
;
; Each real call is recorded with MixMonitor(${UNIQUEID}.wav,b) — the `b` flag
; only records once the call is bridged (answered), so ringing isn't captured.
; MixMonitor writes to Asterisk's monitor spool (default
; /var/spool/asterisk/monitor); point the app's CALL_RECORDING_DIR at the same
; directory (a shared volume in Docker) so post-call summarisation can read it.
; The file is named by ${UNIQUEID}, which matches the AMI DialBegin Uniqueid the
; app correlates against (see app/telephony.py _note_recording).

[globals]
; Caller-ID *number* presented on outbound PSTN calls. Twilio REQUIRES this to
; be either a Twilio number you own OR a number you've verified in the console —
; otherwise the call is rejected. Set it in E.164, e.g. TRUNK_CALLERID=+30...
; (For a free trial test: verify your own mobile in the Twilio console and put
; that same number here — you can then call it using itself as caller ID.)
TRUNK_CALLERID=+306973721106

[internal]
exten => 1001,1,MixMonitor(${UNIQUEID}.wav,b)
 same  => n,Dial(PJSIP/1001,30)
 same  => n,Hangup()

exten => 1002,1,MixMonitor(${UNIQUEID}.wav,b)
 same  => n,Dial(PJSIP/1002,30)
 same  => n,Hangup()

; Echo test — talk and hear yourself back; confirms audio without a 2nd browser.
exten => 600,1,Answer()
 same  => n,Playback(demo-echotest)
 same  => n,Echo()
 same  => n,Hangup()

; Demo convenience: the seeded customer's phone (see seed_demo.sql /
; customer_profile.phone = 2101234567) maps to their softphone (ext 1001), so
; click-to-call from the CRM customer page works without a PSTN trunk. This is a
; SPECIFIC match, so it always wins over the outbound patterns below — that one
; demo number stays internal.
exten => 2101234567,1,MixMonitor(${UNIQUEID}.wav,b)
 same  => n,Dial(PJSIP/1001,30)
 same  => n,Hangup()

; ======================================================================== ;
;  Outbound to the real phone network via the Twilio trunk.                 ;
;                                                                           ;
;  Twilio expects E.164 (a leading +country-code). The CRM stores Greek     ;
;  numbers in national form (10 digits: 2… landline, 69… mobile), and the   ;
;  dialpad may get +30… or 00… — so we normalise all of them to +…          ;
;                                                                           ;
;  All internal extensions (1001/1002/600) and the demo number above are    ;
;  more specific, so they match first; only genuine PSTN numbers fall here. ;
;  If the trunk file (pjsip_trunk.conf) is absent, these simply fail to     ;
;  dial — they never affect the internal demo.                              ;
; ======================================================================== ;

; --- Greek mobile, national form: 69 + 8 digits  ->  +30…
exten => _69XXXXXXXX,1,Set(CALLERID(num)=${IF($["${TRUNK_CALLERID}"!=""]?${TRUNK_CALLERID}:${CALLERID(num)})})
 same  => n,MixMonitor(${UNIQUEID}.wav,b)
 same  => n,Dial(PJSIP/+30${EXTEN}@trunk,60)
 same  => n,Hangup()

; --- Greek landline, national form: 2 + 9 digits  ->  +30…
exten => _2XXXXXXXXX,1,Set(CALLERID(num)=${IF($["${TRUNK_CALLERID}"!=""]?${TRUNK_CALLERID}:${CALLERID(num)})})
 same  => n,MixMonitor(${UNIQUEID}.wav,b)
 same  => n,Dial(PJSIP/+30${EXTEN}@trunk,60)
 same  => n,Hangup()

; --- International dialled with a 00 prefix: 00CC…  ->  +CC…
exten => _00X.,1,Set(CALLERID(num)=${IF($["${TRUNK_CALLERID}"!=""]?${TRUNK_CALLERID}:${CALLERID(num)})})
 same  => n,MixMonitor(${UNIQUEID}.wav,b)
 same  => n,Dial(PJSIP/+${EXTEN:2}@trunk,60)
 same  => n,Hangup()

; --- Already E.164 ( +… )  ->  dial as-is
exten => _+X.,1,Set(CALLERID(num)=${IF($["${TRUNK_CALLERID}"!=""]?${TRUNK_CALLERID}:${CALLERID(num)})})
 same  => n,MixMonitor(${UNIQUEID}.wav,b)
 same  => n,Dial(PJSIP/${EXTEN}@trunk,60)
 same  => n,Hangup()

; ======================================================================== ;
;  Inbound from the trunk — stubbed for now (we're wiring OUTBOUND first).   ;
;  When you add a DID + the prod VPS, route the DID here to an agent's       ;
;  extension and the existing screen-pop fires unchanged. For now, anything  ;
;  that somehow arrives is answered and hung up so it doesn't error.         ;
; ======================================================================== ;
[from-trunk]
exten => _X.,1,NoOp(Inbound from trunk to ${EXTEN} — not routed yet)
 same  => n,Hangup()
