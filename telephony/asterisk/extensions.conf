; extensions.conf — minimal dialplan for the prototype.
;
; Dialing 1001/1002 rings that endpoint. 600 is an echo test for checking your
; mic/speakers in a single tab (no second party needed).
[internal]
exten => 1001,1,Dial(PJSIP/1001,30)
 same  => n,Hangup()

exten => 1002,1,Dial(PJSIP/1002,30)
 same  => n,Hangup()

; Echo test — talk and hear yourself back; confirms audio without a 2nd browser.
exten => 600,1,Answer()
 same  => n,Playback(demo-echotest)
 same  => n,Echo()
 same  => n,Hangup()
