; http.conf — the built-in HTTP server, which also serves the SIP WebSocket
; that the browser softphones connect to (ws://localhost:8088/ws).
;
; Plain ws (not wss) is fine here because the browser page is served from
; http://localhost, which counts as a secure context for WebRTC. For a public
; deployment terminate TLS in front (wss://) and point SIP_WS_URL at it.
[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
