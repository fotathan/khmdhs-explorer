; manager.conf — AMI, the interface the backend screen-pop listener connects to.
;
; The backend logs in with these credentials (AMI_USER / AMI_PASSWORD) and reads
; call events (DialBegin) to drive caller-ID pops. Read-only 'call' + 'dialplan'
; classes are all it needs; no write permissions are granted.
;
; PROTOTYPE credentials — change the secret and tighten permit/ to your Docker
; network before using anywhere shared. AMI is a powerful interface; never
; expose port 5038 to the internet.
[general]
enabled=yes
port=5038
bindaddr=0.0.0.0

[khmdhs]
secret=khmdhs-ami-secret
read=call,dialplan,system
write=
deny=0.0.0.0/0.0.0.0
permit=127.0.0.1/255.255.255.255
permit=172.16.0.0/255.240.0.0
permit=192.168.0.0/255.255.0.0
