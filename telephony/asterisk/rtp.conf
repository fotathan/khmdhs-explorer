; rtp.conf — RTP media port range for WebRTC.
;
; Kept small so the Docker UDP port publish stays manageable (must match the
; range published in docker-compose.yml).
[general]
rtpstart=10000
rtpend=10200
icesupport=yes

; --- macOS / Docker Desktop two-way audio -------------------------------- ;
; Signaling (registration, ringing, screen-pop, call logging) works everywhere
; over Docker. Two-way AUDIO through Docker on macOS needs the browser to reach
; Asterisk's RTP candidate at 127.0.0.1. Asterisk otherwise advertises the
; container's internal IP, which the host can't route to. Map it here:
;
;   1. Find the container IP:  docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' khmdhs-asterisk
;   2. Uncomment and set it below (left = container IP, right = 127.0.0.1), then
;      restart the container.
;
; [ice_host_candidates]
; 172.18.0.2 => 127.0.0.1
;
; On Linux you can instead give the container host networking and skip this.
