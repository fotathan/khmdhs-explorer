# Frankfurt performance-test Blueprint.
#
# This branch intentionally declares only one isolated web service. It mirrors
# the current production topology, where background jobs run inline, so the
# region comparison does not also introduce a worker/cron architecture change.
# Production remains managed by the main branch's existing Blueprint.
services:
  - type: web
    name: khmdhs-explorer-eu
    region: frankfurt
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false

      # Match the current single-service production topology.
      - key: RUN_INLINE_WORKER
        value: "1"

      # Keep passwordless email login disabled until mail deliverability is
      # configured and explicitly verified.
      - key: LOGIN_LINKS_ENABLED
        value: "0"

      # Match the production AI-summary configuration.
      - key: AI_SUMMARY_ENABLED
        value: "1"
      - key: AI_SUMMARY_MODEL
        value: deepseek-flash
      - key: AI_SUMMARY_DAILY_CAP
        value: "10"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # Registry enrichment used by the admin surfaces.
      - key: GEMI_API_KEY
        sync: false
      - key: GEMI_CONTACT
        sync: false

      # Use the isolated Render URL until a user-owned domain is available.
      - key: APP_BASE_URL
        value: https://khmdhs-explorer-eu.onrender.com

      # Prevent the test deployment from competing with production in search.
      - key: SEO_INDEX
        value: "0"
