{# _acct_nav.html — the tab strip at the top of every /account page.
   Replaces the old "← back to account" links: each page is now a sibling,
   not a child of a hub. Scrolls sideways on a phone rather than wrapping. #}
<nav class="acct-tabs" aria-label="{{ t('Ο λογαριασμός μου') }}">
  {% include "_acct_links.html" %}
</nav>
<style>
  .acct-tabs{display:flex;gap:4px;margin:0 0 22px;padding-bottom:0;border-bottom:1px solid var(--rule,#e6e8ec);
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .acct-tabs::-webkit-scrollbar{display:none;}
  .acct-tabs a{flex:0 0 auto;padding:9px 14px;margin-bottom:-1px;font-size:13.5px;font-weight:500;
    color:var(--ink-2,#5b626d);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;}
  .acct-tabs a:hover{color:var(--ink,#14181f);}
  .acct-tabs a.on{color:var(--accent,#b41034);border-bottom-color:var(--accent,#b41034);font-weight:600;}
</style>
<script>
  // After the <style> above, or the strip has no overflow yet to scroll.
  // On a phone the strip scrolls sideways; bring the current tab into view
  // so a later page is not marked off-screen.
  (function(){
    var nav=document.querySelector('.acct-tabs'), on=nav && nav.querySelector('a.on');
    if(on && nav.scrollWidth>nav.clientWidth)
      nav.scrollLeft=on.offsetLeft-nav.offsetLeft-(nav.clientWidth-on.offsetWidth)/2;
  })();
</script>
