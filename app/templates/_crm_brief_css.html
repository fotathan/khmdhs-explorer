{# _crm_brief_css.html — styles for _crm_brief.html, included once by the CRM
   card (the dialog) and once by admin_crm_brief.html (the print page). Every
   colour has a fallback because the print page has no site stylesheet. #}
<style>
  .brief{font-size:13px;line-height:1.5;color:var(--ink,#1b1b1b);}
  .brief-dlg{width:min(1100px,calc(100vw - 32px));}
  .brief-h{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;
    align-items:flex-start;}
  .brief-kicker{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-3,#6b6b6b);}
  .brief-title{margin:2px 0 2px;font-size:19px;line-height:1.3;}
  .brief-sub{color:var(--ink-2,#444);font-size:12.5px;}
  .brief-tools{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12.5px;}
  .brief-basis{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;
    background:#eef2f7;color:#1f3a5f;white-space:nowrap;}
  .brief-basis.is-kad,.brief-basis.is-history-kad{background:#fdf3e7;color:#8a5a1c;}
  .brief-basis.is-none{background:#f0f0f0;color:#6b6b6b;}
  .brief-kad{margin:10px 0 0;font-size:12.5px;}
  .brief-sec{margin-top:16px;padding-top:12px;border-top:1px solid var(--rule,#d9d9d9);}
  .brief-sec h3{margin:0 0 8px;font-size:15px;display:flex;gap:8px;align-items:center;}
  .brief-sec h4{margin:14px 0 6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--ink-2,#444);}
  .brief-est{background:linear-gradient(#fffaf2,#fffaf2) padding-box;}
  .brief-note{font-size:12.5px;color:var(--ink-2,#444);margin:0 0 8px;line-height:1.55;}
  .brief-stats{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;}
  .brief-stats>div{flex:1 1 130px;border:1px solid var(--rule,#d9d9d9);border-radius:10px;
    padding:8px 12px;background:var(--paper,#fff);}
  .brief-stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums;}
  .brief-stats span{font-size:11.5px;color:var(--ink-3,#6b6b6b);}
  .brief-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 24px;}
  .brief-list{margin:0;padding-left:20px;}
  .brief-list li{margin:2px 0;}
  .brief-tbl td,.brief-areas td{vertical-align:top;}
  .brief .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .brief-same{font-weight:600;color:#1f8a63;}
  .brief-foot{margin-top:16px;font-size:11.5px;}
  .fit-kad-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;
    background:#fdf3e7;color:#8a5a1c;}
</style>
